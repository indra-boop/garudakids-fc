<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@600;800&display=swap">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;
    background:radial-gradient(90% 80% at 15% 25%,#7C1220 0%,#3D080F 60%,#1A0509 100%);color:#fff;
    display:flex;align-items:center;padding:70px 80px;position:relative}
  .pat{position:absolute;inset:0;background-image:url('../static/assets/img/pattern-shield.svg');background-size:230px;opacity:.14}
  .bar{position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#A8791C,#F0D488,#A8791C)}
  .in{position:relative;z-index:2;display:flex;gap:56px;align-items:center;width:100%}
  img{width:230px;height:auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
  .eb{font-size:17px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#F0D488}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:88px;line-height:.95;text-transform:uppercase;margin-top:18px;letter-spacing:-.01em}
  h1 em{font-style:normal;color:#E0B54A;display:block}
  p{margin-top:22px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82)}
  .ft{position:absolute;left:80px;bottom:52px;z-index:2;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:rgba(240,212,136,.85);font-weight:700}
</style></head>
<body>
<div class="bar"></div><div class="pat"></div>
<div class="in">
  <img src="../static/assets/img/logo.png" onerror="this.onerror=null;this.src='../static/assets/img/logo-placeholder.svg'" alt="">
  <div>
    <div class="eb">Youth Football Academy</div>
    <h1>Building the<em>Next Generation</em></h1>
    <p>Learn · Train · Compete · Grow</p>
  </div>
</div>
<div class="ft">Lapangan Jogo Reso Kedungpeluk · Candi · Sidoarjo</div>
</body></html>
